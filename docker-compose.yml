version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lowfares-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - USE_MOCK_DATA=true
      - SCRAPER_TIMEOUT_MS=20000
      - CACHE_TTL_SECONDS=900
    restart: unless-stopped
    volumes:
      - ./prisma/data:/app/prisma

  redis:
    image: redis:7-alpine
    container_name: lowfares-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
